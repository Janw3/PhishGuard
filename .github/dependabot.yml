# Dependabot opens pull requests for outdated dependencies once a week.
# CI runs on each of them, so a green PR is usually safe to merge.
# Minor and patch updates are grouped per ecosystem to keep the number of PRs small.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
